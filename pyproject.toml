[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "civicops-ml"
version = "0.3.0"
description = "Leakage-aware resolution-risk modeling for NYC 311 service requests"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Bryan Mowrey" }]
dependencies = [
  "azure-monitor-opentelemetry>=1.8.9,<2",
  "fastapi>=0.141,<1",
  "joblib>=1.5,<2",
  "itsdangerous>=2.2,<3",
  "msal>=1.37,<2",
  "numpy>=2.3,<3",
  "pandas>=3.0,<4",
  "pydantic>=2.13,<3",
  "psycopg[binary,pool]>=3.3,<4",
  "python-dotenv>=1.2,<2",
  "scikit-learn>=1.9,<2",
  "scipy>=1.18,<2",
  "uvicorn[standard]>=0.52,<1",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.urls]
Dataset = "https://data.cityofnewyork.us/d/erm2-nwe9"

[project.optional-dependencies]
test = ["httpx2>=2.10,<3"]

[project.scripts]
civicops-ml = "civicops_ml.api:main"
civicops-migrate = "civicops_ml.migrate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
civicops_ml = ["static/*", "migrations/*.sql"]
