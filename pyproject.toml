[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "civicops-ml"
version = "0.1.0"
description = "Leakage-aware resolution-risk modeling for NYC 311 service requests"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Bryan Mowrey" }]
dependencies = [
  "joblib>=1.5,<2",
  "numpy>=2.3,<3",
  "pandas>=3.0,<4",
  "scikit-learn>=1.9,<2",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.urls]
Dataset = "https://data.cityofnewyork.us/d/erm2-nwe9"

[tool.setuptools.packages.find]
where = ["src"]
